<title>My business cards</title>

<meta name="theme-color" content="#1a3fbf">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#1a3fbf;color:#fff;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:26px 18px 50px}
h1{font-size:26px;margin:6px 0 4px}.sub{opacity:.85;margin:0 0 20px}
.biz{display:flex;align-items:center;gap:14px;width:100%;background:#fff;color:#111;border:0;border-radius:16px;padding:12px;margin-bottom:12px;font-size:18px;text-align:left;cursor:pointer;font-family:inherit}
.biz img,.ini{width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid #ddd;flex:none}
.ini{display:grid;place-items:center;background:#e8edff;color:#1a3fbf;font-weight:700;font-size:22px}
.biz b{display:block}.biz span{font-size:14px;color:#555}
.panel{background:#fff;color:#111;border-radius:18px;padding:18px;text-align:center}
.qrbox{display:grid;place-items:center;margin:6px 0}.qrbox svg{width:100%;max-width:300px;height:auto}
.btn{display:block;text-decoration:none;text-align:center;font-weight:700;padding:14px;border-radius:12px;margin-top:10px;font-size:17px;border:0;width:100%;cursor:pointer;font-family:inherit}
.p{background:#111;color:#fff}.s{background:#e8edff;color:#1a3fbf}.d{background:#fde8e8;color:#a11}
.back{background:none;border:0;color:#fff;font-size:17px;margin-bottom:14px;padding:6px 0;cursor:pointer;font-family:inherit}
.hint{font-size:13px;opacity:.8;margin-top:18px;text-align:center}
label{display:block;text-align:left;font-size:13px;color:#555;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=email],input[type=url]{width:100%;font-size:17px;padding:12px;border:1px solid #ccd;border-radius:10px;font-family:inherit}
.err{color:#a11;font-size:14px;margin-top:8px}
.crop{width:260px;height:260px;margin:10px auto;border-radius:50%;overflow:hidden;border:2px solid #1a3fbf;touch-action:none;background:#fff}
.crop canvas{width:260px;height:260px;display:block}
input[type=range]{width:100%}
</style></head><body><div class="wrap" id="app"></div>

const KEY='mycards.v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){alert('Could not save on this phone (storage full?).');return false}}
const app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function vesc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,' ')}
function fold(line){const o=[line.slice(0,75)];for(let i=75;i<line.length;i+=74)o.push(' '+line.slice(i,i+74));return o.join('\r\n')}
function vcard(c,withPhoto){
 const parts=c.person.trim().split(/\s+/);const last=parts.length>1?parts.pop():'';const first=parts.join(' ');
 const L=['BEGIN:VCARD','VERSION:3.0','N:'+vesc(last)+';'+vesc(first)+';;;','FN:'+vesc(c.person.trim()),'ORG:'+vesc(c.name)];
 if(c.role)L.push('TITLE:'+vesc(c.role));
 if(c.mobile)L.push('TEL;TYPE=CELL:'+c.mobile.replace(/[^+\d]/g,''));
 if(c.office)L.push('TEL;TYPE=WORK,VOICE:'+c.office.replace(/[^+\d]/g,''));
 if(c.email)L.push('EMAIL;TYPE=WORK:'+c.email.trim());
 if(c.website)L.push('URL:'+c.website.trim());
 if(withPhoto&&c.photo){const m=c.photo.match(/^data:image\/jpeg;base64,(.+)$/);if(m)L.push(fold('PHOTO;ENCODING=b;TYPE=JPEG:'+m[1]))}
 L.push('END:VCARD');return L.join('\r\n')+'\r\n';
}
function qrSvg(text){
 for(const ec of ['M','L']){try{const q=qrcode(0,ec);q.addData(text);q.make();return q.createSvgTag({cellSize:6,margin:4,scalable:true})}catch(e){}}
 return null;
}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')}
function row(b){return '<button class="biz" data-id="'+esc(b.id)+'">'+(b.photo?'<img src="'+b.photo+'" alt="">':'<div class="ini">'+esc(initials(b.name))+'</div>')+'<div><b>'+esc(b.name)+'</b><span>'+esc(b.role||'')+'</span></div></button>'}
function list(){
 app.innerHTML='<h1>My business cards</h1><p class="sub">Tap a business to show its QR code.</p>'+
  BUILTIN.map(row).join('')+load().map(c=>row({id:c.id,name:c.name,photo:c.photo,role:c.person+(c.role?', '+c.role:'')})).join('')+
  '<button class="biz" id="add" style="justify-content:center;background:transparent;color:#fff;border:2px dashed #fff">+ Add business</button>'+
  '<div style="display:flex;gap:10px;margin-top:6px"><button class="btn s" id="bk" style="margin-top:0">Back up</button><button class="btn s" id="rs" style="margin-top:0">Restore</button></div><input type="file" id="rsf" accept=".json,application/json" hidden>'+
  '<p class="hint">Tip: add this page to your home screen so it opens like an app. Businesses you add stay on this phone only.</p>';
 app.querySelectorAll('.biz[data-id]').forEach(el=>el.onclick=()=>{location.hash=el.dataset.id});
 document.getElementById('add').onclick=()=>{location.hash='new'};
 document.getElementById('bk').onclick=backup;
 document.getElementById('rs').onclick=()=>document.getElementById('rsf').click();
 document.getElementById('rsf').onchange=e=>restore(e.target.files[0]);
}
function backup(){
 const a=load();if(!a.length){alert('You have not added any businesses yet, so there is nothing to back up.');return}
 const d=new Date();const n='my-cards-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
 const u=URL.createObjectURL(new Blob([JSON.stringify({app:'my-cards',version:1,businesses:a})],{type:'application/json'}));
 const l=document.createElement('a');l.href=u;l.download=n;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}
function restore(f){
 if(!f)return;
 const r=new FileReader();
 r.onerror=()=>alert('Could not read that file.');
 r.onload=()=>{
  let j;try{j=JSON.parse(r.result)}catch(e){alert('That is not a backup file from this app.');return}
  if(!j||j.app!=='my-cards'||!Array.isArray(j.businesses)){alert('That is not a backup file from this app.');return}
  const S=v=>typeof v==='string'?v:'';
  const clean=j.businesses.filter(b=>b&&typeof b==='object'&&S(b.id)&&S(b.name)&&S(b.person)).map(b=>({id:S(b.id).slice(0,60),name:S(b.name).slice(0,120),person:S(b.person).slice(0,120),role:S(b.role).slice(0,120),mobile:S(b.mobile).slice(0,40),office:S(b.office).slice(0,40),email:S(b.email).slice(0,160),website:/^https?:\/\//i.test(S(b.website))?S(b.website).slice(0,200):'',photo:/^data:image\/(png|jpeg|jpg|webp);base64,[A-Za-z0-9+\/=]+$/.test(S(b.photo))?S(b.photo):''}));
  if(!clean.length){alert('That backup has no businesses in it.');return}
  const cur=load();const have=new Set(cur.map(x=>x.id));const add=clean.filter(b=>!have.has(b.id));
  if(!add.length){alert('Everything in that backup is already in the app.');return}
  if(!confirm('Add '+add.length+' business'+(add.length>1?'es':'')+' from the backup? Businesses already in the app stay as they are.'))return;
  if(save(cur.concat(add))){alert('Restored.');list()}
 };
 r.readAsText(f);
}
function showBuiltin(b){
 app.innerHTML='<button class="back">‹ All my cards</button><div class="panel"><h2 style="margin:0 0 4px">'+esc(b.name)+'</h2><p style="margin:0 0 10px;color:#555">Let them scan this with their phone camera</p><div class="qrbox">'+qrSvg(b.url)+'</div></div>';
 app.querySelector('.back').onclick=()=>{location.hash=''};
}
function showCustom(c){
 const svg=qrSvg(vcard(c,false));
 app.innerHTML='<button class="back">‹ All my cards</button><div class="panel"><h2 style="margin:0 0 4px">'+esc(c.name)+'</h2><p style="margin:0 0 10px;color:#555">Let them scan this with their phone camera</p><div class="qrbox">'+(svg||'<p class="err">Too much text for one QR code. Shorten the details.</p>')+'</div><button class="btn s" id="ed">Edit</button><button class="btn d" id="del">Delete</button></div>';
 app.querySelector('.back').onclick=()=>{location.hash=''};
 document.getElementById('ed').onclick=()=>{location.hash='edit-'+c.id};
 document.getElementById('del').onclick=()=>{if(confirm('Delete '+c.name+' from this phone?')){save(load().filter(x=>x.id!==c.id));location.hash=''}};
}
function form(c){
 const v=c||{person:'Clover Baker',role:'Director',mobile:'+27 83 260 7032'};
 let photo=v.photo||'';
 const f=(id,l,val,type,ph)=>'<label for="'+id+'">'+l+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'" autocomplete="off">';
 app.innerHTML='<button class="back">‹ Cancel</button><div class="panel"><h2 style="margin:0">'+(c?'Edit business':'Add business')+'</h2>'+
  f('name','Business name *',v.name,'text','e.g. Coolfings')+f('person','Your name *',v.person)+f('role','Title',v.role)+f('mobile','Mobile',v.mobile,'tel')+f('office','Office phone',v.office,'tel')+f('email','Email',v.email,'email')+f('website','Website',v.website,'url','https://')+
  '<label>Logo or picture (optional)</label><div id="pv"></div><input type="file" id="file" accept="image/*" style="display:none"><button class="btn s" id="pick" type="button">Choose picture</button>'+
  '<div class="err" id="err"></div><button class="btn p" id="ok">Save</button></div>';
 const pv=document.getElementById('pv');
 function showPv(){pv.innerHTML=photo?'<img src="'+photo+'" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid #ddd"><button class="btn d" id="rm" type="button" style="width:auto;display:inline-block;padding:8px 14px;margin-left:10px;vertical-align:top">Remove</button>':'';const r=document.getElementById('rm');if(r)r.onclick=()=>{photo='';showPv()}}
 showPv();
 app.querySelector('.back').onclick=()=>{history.length>1?history.back():(location.hash='')};
 document.getElementById('pick').onclick=()=>document.getElementById('file').click();
 document.getElementById('file').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const img=new Image();img.onload=()=>cropper(img,d=>{photo=d;showPv();pv.scrollIntoView()});img.onerror=()=>{document.getElementById('err').textContent='Could not read that picture.'};img.src=URL.createObjectURL(fl)};
 document.getElementById('ok').onclick=()=>{
  const g=id=>document.getElementById(id).value.trim();
  const n={id:c?c.id:'c'+Date.now().toString(36),name:g('name'),person:g('person'),role:g('role'),mobile:g('mobile'),office:g('office'),email:g('email'),website:g('website'),photo:photo};
  if(!n.name||!n.person){document.getElementById('err').textContent='Business name and your name are required.';return}
  if(n.website&&!/^https?:\/\//i.test(n.website))n.website='https://'+n.website;
  if(!qrSvg(vcard(n,false))){document.getElementById('err').textContent='Too much text for one QR code. Shorten the details.';return}
  const a=load();const i=a.findIndex(x=>x.id===n.id);if(i>=0)a[i]=n;else a.push(n);if(save(a))location.hash=n.id;
 };
}
function cropper(img,done){
 const S=260,ov=document.createElement('div');
 ov.style.cssText='position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:9;padding:16px';
 ov.innerHTML='<div class="panel" style="width:100%;max-width:340px"><h3 style="margin:0">Crop the picture</h3><p style="margin:4px 0;color:#555;font-size:14px">Drag to move, slide to zoom</p><div class="crop"><canvas id="cv" width="'+S+'" height="'+S+'"></canvas></div><input type="range" id="zm" min="1" max="6" step="0.01" value="1"><button class="btn p" id="use">Use this crop</button><button class="btn s" id="no">Cancel</button></div>';
 document.body.appendChild(ov);
 const cv=ov.querySelector('#cv'),ctx=cv.getContext('2d');
 const base=Math.min(S/img.width,S/img.height);let z=1,ox=0,oy=0;
 function clamp(){const w=img.width*base*z,h=img.height*base*z;ox=w<=S?(S-w)/2:Math.min(0,Math.max(S-w,ox));oy=h<=S?(S-h)/2:Math.min(0,Math.max(S-h,oy))}
 function draw(){clamp();ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);ctx.drawImage(img,ox,oy,img.width*base*z,img.height*base*z)}
 ox=(S-img.width*base)/2;oy=(S-img.height*base)/2;draw();
 let drag=null;
 cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!drag)return;ox=drag.ox+(e.clientX-drag.x);oy=drag.oy+(e.clientY-drag.y);draw()};
 cv.onpointerup=cv.onpointercancel=()=>{drag=null};
 ov.querySelector('#zm').oninput=e=>{const nz=parseFloat(e.target.value);const cx=(S/2-ox)/(base*z),cy=(S/2-oy)/(base*z);z=nz;ox=S/2-cx*base*z;oy=S/2-cy*base*z;draw()};
 ov.querySelector('#no').onclick=()=>ov.remove();
 ov.querySelector('#use').onclick=()=>{const o=document.createElement('canvas');o.width=o.height=256;const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,256,256);x.drawImage(cv,0,0,256,256);done(o.toDataURL('image/jpeg',0.85));ov.remove()};
}
function route(){
 const h=decodeURIComponent(location.hash.slice(1));
 if(h==='new')return form();
 if(h.startsWith('edit-')){const c=load().find(x=>x.id===h.slice(5));return c?form(c):list()}
 const b=BUILTIN.find(x=>x.id===h);if(b)return showBuiltin(b);
 const c=load().find(x=>x.id===h);if(c)return showCustom(c);
 list();
}
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
